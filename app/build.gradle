plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amresh.taskreminder'
    compileSdk 34

    defaultConfig {
        applicationId "com.amresh.taskreminder"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

     // Same debug signing key for every build, so a new APK installs over the old one
    // (GitHub Actions would otherwise create a fresh random key on each run).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
}
